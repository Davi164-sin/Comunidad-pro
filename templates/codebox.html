<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeBox Mobile</title>
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <style>
    /* Ajuste para que CodeMirror encaje en el editor-container */
    .CodeMirror { height: 100%; font-family: 'Courier New', monospace; font-size: 14px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: black; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    header { width: 100%; background: linear-gradient(135deg, #667eac 50%, #0f2210 100%); padding: 10px; text-align: center; }
    header h1 { font-size: 1.5em; margin-bottom: 5px; }
    #sync-indicator { font-size: 0.85em; opacity: 0.9; }
    #sync-indicator.online { color: #4ade80; }
    #sync-indicator.offline { color: #ef4444; }
    #tabs { display: flex; background: #2d2d2d; border-bottom: 2px solid #444; }
    .tab { flex: 1; padding: 12px; background: #2d2d2d; color: #888; border: none; font-size: 14px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
    .tab.active { color: #fff; border-bottom-color: #4CAF50; }
    .editor-container { height: 35vh; position: relative; overflow: hidden; }
    .editor-wrap { display: none; width: 100%; height: 100%; }
    .editor-wrap.active { display: block; }
    #keyboard { height: 30vh; background: transparent; padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; box-sizing: border-box; }
    .key { width: 100%; background: #3e3e3e; color: #fff; border: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .key:active { background-color: #4e4e4e; transform: scale(0.95); }
    #runButton { background: #4CAF50; grid-column: span 2; }
    .container-preview { width: 100%; border: none; padding: 0; margin: 0; }
    #preview { background: #fff; height: 300px; border-top: 2px solid #444; overflow: auto; }
    #preview iframe { width: 100%; height: 100%; border: none; }
    #console { background: #0d0d0d; color: #00ff00; padding: 10px; font-family: 'Courier New', monospace; font-size: 12px; height: 100px; overflow-y: auto; border-top: 2px solid #444; }
    .code { width: 100%; background: transparent; color: #fff; border: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>💻 CodeBox Pro</h1>
    <div id="sync-indicator" class="online">● Sincronizado</div>
      <div id="tabs" class="code">
      <button class="tab active" onclick="switchTab('html')">HTML</button>
      <button class="tab" onclick="switchTab('css')">CSS</button>
      <button class="tab" onclick="switchTab('js')">JS</button>
    </div>
     <button id="runButton" class="key" onclick="runCode()">▶ Ejecutar</button>
     <div style="margin-top: 8px; display: flex; justify-content: center; gap: 5px;">
       <button class="key" style="font-size: 11px; padding: 6px; background: #2b6cb0;" onclick="loadTemplate('personal')">📄 Personal</button>
       <button class="key" style="font-size: 11px; padding: 6px; background: #2b6cb0;" onclick="loadTemplate('tarjeta')">🎨 Tarjeta</button>
       <button class="key" style="font-size: 11px; padding: 6px; background: #2b6cb0;" onclick="loadTemplate('blog')">📰 Blog</button>
     </div>
  </header>

  <div class="container-preview">
    <div id="preview"><iframe></iframe></div>
  </div>

  <main>
    <div class="editor-container">
      <div id="htmlEditorWrap" class="editor-wrap active"><textarea id="htmlEditor"></textarea></div>
      <div id="cssEditorWrap" class="editor-wrap"><textarea id="cssEditor"></textarea></div>
      <div id="jsEditorWrap" class="editor-wrap"><textarea id="jsEditor"></textarea></div>
    </div>

    <div id="keyboard">
      <button class="key" onclick="insertText('{')">{</button>
      <button class="key" onclick="insertText('}')">}</button>
      <button class="key" onclick="insertText('(')">(</button>
      <button class="key" onclick="insertText(')')">)</button>
      <button class="key" onclick="insertText('<')">&lt;</button>
      <button class="key" onclick="insertText('>')">&gt;</button>
      <button class="key" onclick="insertText(';')">;</button>
      <button class="key" onclick="insertText('=')">=</button>
      <button class="key" onclick="clearAll()">🗑️</button>
      <button class="key" onclick="saveCode()">💾</button>
    </div>
    <div id="console"></div>
  </main>

  <script>
    const editors = {
      html: CodeMirror.fromTextArea(document.getElementById('htmlEditor'), { mode: 'htmlmixed', theme: 'dracula', lineNumbers: true }),
      css: CodeMirror.fromTextArea(document.getElementById('cssEditor'), { mode: 'css', theme: 'dracula', lineNumbers: true }),
      js: CodeMirror.fromTextArea(document.getElementById('jsEditor'), { mode: 'javascript', theme: 'dracula', lineNumbers: true })
    };

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.editor-wrap').forEach(e => e.classList.remove('active'));
      document.getElementById(tab + 'EditorWrap').classList.add('active');
      editors[tab].refresh();
      editors[tab].focus();
    }

    function insertText(text) {
      editors[currentTab].replaceSelection(text);
      editors[currentTab].focus();
    }

    function runCode() {
      const consoleDiv = document.getElementById('console');
      consoleDiv.innerHTML = '';
      const html = editors.html.getValue();
      const css = `<style>${editors.css.getValue()}</style>`;
      const jsWithConsole = `<script>
        const originalLog = console.log;
        console.log = (...args) => { window.parent.postMessage({type: 'console', message: args.join(' ')}, '*'); originalLog(...args); };
        try { ${editors.js.getValue()} } catch(e) { window.parent.postMessage({type: 'error', message: e.message}, '*'); }
      <\/script>`;
      const preview = document.getElementById('preview');
      preview.innerHTML = '<iframe></iframe>';
      const iframe = preview.querySelector('iframe');
      iframe.contentDocument.open();
      iframe.contentDocument.write(`<html><head>${css}</head><body>${html}${jsWithConsole}</body></html>`);
      iframe.contentDocument.close();
    }

    window.addEventListener('message', e => {
      const consoleDiv = document.getElementById('console');
      if (e.data.type === 'console') consoleDiv.innerHTML += `✅ ${e.data.message}\n`;
      else if (e.data.type === 'error') consoleDiv.innerHTML += `❌ Error: ${e.data.message}\n`;
    });

    function clearAll() {
      if (confirm('¿Borrar todo el código?')) {
        Object.values(editors).forEach(e => e.setValue(''));
        document.getElementById('preview').innerHTML = '<iframe></iframe>';
        document.getElementById('console').innerHTML = '';
      }
    }

    function saveCode() {
      localStorage.setItem('codebox-html', editors.html.getValue());
      localStorage.setItem('codebox-css', editors.css.getValue());
      localStorage.setItem('codebox-js', editors.js.getValue());
      alert('💾 Código guardado');
    }

    function loadTemplate(type) {
      if (type === 'personal') {
        editors.html.setValue(`<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sobre Mí</title>
</head>
<body>
    <header>
        <h1>¡Hola, soy [Tu Nombre]!</h1>
        <p>Estudiante apasionado por el desarrollo web y la tecnología.</p>
    </header>
    <section>
        <h2>Mis Hobbies</h2>
        <ul>
            <li>Programar</li>
            <li>Leer ciencia ficción</li>
            <li>Jugar videojuegos</li>
        </ul>
        <p>Visita mi perfil de GitHub:</p>
        <a href="https://github.com" target="_blank">Ir a GitHub</a>
    </section>
</body>
</html>`);
        editors.css.setValue('');
        editors.js.setValue('');
      } else if (type === 'tarjeta') {
        editors.html.setValue(`<div class="card">
    <img src="https://via.placeholder.com/100" alt="Avatar">
    <h2>Ana Pérez</h2>
    <p>Desarrolladora Frontend en formación.</p>
    <a href="#" class="btn">Contactar</a>
</div>`);
        editors.css.setValue(`body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
.card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
.btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
.btn:hover { background: #0056b3; }`);
        editors.js.setValue('');
      } else if (type === 'blog') {
        editors.html.setValue(`<header>
    <h1>TechBlog 🚀</h1>
    <p>Artículos sobre desarrollo web y tecnología.</p>
</header>
<nav>
    <a href="#">Inicio</a>
    <a href="#">Artículos</a>
    <a href="#">Contacto</a>
</nav>
<main>
    <article>
        <h2>¿Por qué aprender HTML hoy?</h2>
        <p>HTML es la base fundamental de internet y la estructura web.</p>
    </article>
</main>
<footer>
    <p>&copy; 2026 TechBlog</p>
</footer>`);
        editors.css.setValue(`body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; line-height: 1.6; color: #333; background-color: #fafafa; }
header { background: #2c3e50; color: white; padding: 25px; text-align: center; }
nav { background: #34495e; padding: 12px; text-align: center; }
nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
article { background: #fff; padding: 25px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
footer { text-align: center; padding: 15px; background: #2c3e50; color: white; margin-top: 40px; }`);
        editors.js.setValue('');
      }
      runCode();
      alert('✅ Plantilla cargada en CodeBox');
    }

    window.onload = () => {
      editors.html.setValue(localStorage.getItem('codebox-html') || '');
      editors.css.setValue(localStorage.getItem('codebox-css') || '');
      editors.js.setValue(localStorage.getItem('codebox-js') || '');
    };
    
    let currentTab = 'html';
  </script>
</body>
</html>
