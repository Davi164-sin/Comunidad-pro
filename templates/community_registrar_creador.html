<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Creador - ComunidadPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"><i class="fas fa-users text-primary me-2"></i>ComunidadPro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Panel</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light btn-sm ms-2 mt-1" href="{{ url_for('logout') }}">Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 bg-white">
                    <h3 class="fw-bold mb-4 text-center"><i class="fas fa-star text-warning me-2"></i>Registro de Perfil de Creador</h3>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Nombre Artístico o Marca</label>
                            <input type="text" name="nombre_artistico" class="form-control" value="{{ perfil.nombre_artistico if perfil else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select name="categoria" class="form-select" required>
                                <option value="Arte" {{ 'selected' if perfil and perfil.categoria == 'Arte' else '' }}>Arte</option>
                                <option value="Tecnología" {{ 'selected' if perfil and perfil.categoria == 'Tecnología' else '' }}>Tecnología</option>
                                <option value="Educación" {{ 'selected' if perfil and perfil.categoria == 'Educación' else '' }}>Educación</option>
                                <option value="Streaming" {{ 'selected' if perfil and perfil.categoria == 'Streaming' else '' }}>Streaming</option>
                                <option value="Diseño" {{ 'selected' if perfil and perfil.categoria == 'Diseño' else '' }}>Diseño</option>
                                <option value="Contenido Exclusivo" {{ 'selected' if perfil and perfil.categoria == 'Contenido Exclusivo' else '' }}>Contenido Exclusivo</option>
                                <option value="Otro" {{ 'selected' if perfil and perfil.categoria == 'Otro' else '' }}>Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Biografía o Descripción</label>
                            <textarea name="biografia" class="form-control" rows="4" required>{{ perfil.biografia if perfil else '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Avatar / Foto de Perfil (Imagen)</label>
                            <input type="file" name="avatar" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contenido Multimedia Destacado (Video, Imagen o Audio)</label>
                            <input type="file" name="multimedia" class="form-control" accept="image/*,video/mp4,audio/mp3,audio/wav">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Enlace a tu Contenido / Portafolio / Sitio Web</label>
                            <input type="url" name="enlace_contenido" class="form-control" placeholder="https://..." value="{{ perfil.enlace_contenido if perfil else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Redes Sociales o Contacto</label>
                            <input type="text" name="redes" class="form-control" placeholder="@tucuenta" value="{{ perfil.redes if perfil else '' }}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Guardar y Enviar a Revisión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
