<!DOCTYPE html>
<!-- 
  CURSO DE HTML - PLANTILLA 2: Tarjeta de Perfil Moderna
  Objetivo: Introducir estilos CSS básicos dentro de la etiqueta <style> y diseño visual.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Perfil</title>
    
    <!-- CSS interno para dar diseño y presentación visual -->
    <style>
        /* Estilos generales del cuerpo de la página */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        /* Contenedor de la tarjeta */
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 300px; 
        }

        /* Imagen de perfil circular */
        .card img { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            object-fit: cover; 
        }

        /* Botón interactivo */
        .btn { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 10px 20px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            transition: background 0.3s;
        }

        /* Efecto hover al pasar el ratón por encima */
        .btn:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

    <!-- Tarjeta contenedora -->
    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Avatar">
        <h2>Ana Pérez</h2>
        <p>Desarrolladora Frontend en formación.</p>
        <a href="#" class="btn">Contactar</a>
    </div>

</body>
</html>
