<!DOCTYPE html>
<!-- 
  CURSO DE HTML - PLANTILLA 1: Mi Primera Página Personal
  Objetivo: Aprender la estructura básica, títulos, párrafos y listas.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mí - Mi Primera Web</title>
</head>
<body>

    <!-- Cabecera principal de la página -->
    <header>
        <!-- h1 es el título principal (solo debe haber uno por página) -->
        <h1>¡Hola, soy [Tu Nombre]!</h1>
        <!-- p define un párrafo de texto -->
        <p>Estudiante apasionado por el desarrollo web y la tecnología.</p>
    </header>

    <!-- Sección de contenido -->
    <section>
        <!-- h2 es un subtítulo para seccionar contenido -->
        <h2>Mis Hobbies</h2>
        
        <!-- ul crea una lista desordenada (con viñetas / viñetas de puntos) -->
        <ul>
            <!-- li representa cada elemento (item) de la lista -->
            <li>Programar</li>
            <li>Leer ciencia ficción</li>
            <li>Jugar videojuegos</li>
        </ul>

        <p>Visita mi perfil de GitHub:</p>
        
        <!-- a crea un enlace (anchor). target="_blank" abre el enlace en otra pestaña -->
        <a href="https://github.com" target="_blank">Ir a GitHub</a>
    </section>

</body>
</html>
